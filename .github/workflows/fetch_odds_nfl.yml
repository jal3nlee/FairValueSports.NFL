name: Fetch NFL Odds

on:
  schedule:
    # 5 minutes is GitHub Actions' shortest *supported* scheduled-workflow
    # interval (docs.github.com/en/actions/using-workflows/
    # events-that-trigger-workflows#schedule) — a 1-minute cron is not
    # reliable and runs can be delayed/dropped under high platform load.
    # fetch_odds_nfl.py self-throttles against the game-state-driven
    # interval (currently 5min live/pregame/gameday, 30min off-peak — see
    # fetch_odds_nfl.py for why live/pregame aren't faster than 5min yet),
    # so off-peak invocations exit immediately with a single cheap Supabase
    # read and no Odds API call.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Prevent overlapping runs: if a previous run is still in progress when the
# next scheduled trigger fires, the new run waits rather than running
# concurrently against the same Supabase tables.
concurrency:
  group: fetch-nfl-odds
  cancel-in-progress: false

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests supabase
      - name: Run fetch script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_odds_nfl.py
