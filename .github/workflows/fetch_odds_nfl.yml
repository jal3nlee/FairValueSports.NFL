name: Fetch NFL Odds

on:
  schedule:
    # Finest interval cron supports (1 min) — matches the live-window
    # target cadence. fetch_odds_nfl.py self-throttles against the actual
    # game-state-driven interval (60s live / 3min pregame / 5min gameday /
    # 30min off-peak), so most off-peak invocations exit immediately with
    # a single cheap Supabase read and no Odds API call.
    - cron: "* * * * *"
  workflow_dispatch:

# Prevent overlapping runs: if a previous run is still in progress when the
# next minute's trigger fires, the new run waits rather than running
# concurrently against the same Supabase tables.
concurrency:
  group: fetch-nfl-odds
  cancel-in-progress: false

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests supabase
      - name: Run fetch script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_odds_nfl.py
